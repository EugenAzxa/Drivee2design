  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

me span { color: var(--drivee-bright); }\n  .crumbs {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size:11px; color: var(--ink-dim);\n    letter-spacing:0.04em;\n  }\n\n  /* TITLE BLOCK */\n  .title-card {\n    position:fixed;\n    top:80px; left:24px; z-index:10;\n    max-width: 360px;\n    pointer-events:none;\n  }\n  .title-eyebrow {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size:11px; color: var(--drivee-bright);\n    letter-spacing:0.18em; text-transform:uppercase;\n    margin-bottom:10px;\n  }\n  .title-eyebrow .dot {\n    display:inline-block; width:6px; height:6px; border-radius:50%;\n    background: var(--drivee-orange); margin-right:6px;\n    box-shadow: 0 0 10px var(--drivee-orange);\n    animation: pulse 1.6s infinite;\n  }\n  @keyframes pulse {\n    0%,100% { opacity:1; }\n    50% { opacity:0.3; }\n  }\n  .title-h1 {\n    font-size: clamp(40px, 5vw, 72px);\n    font-weight: 800;\n    letter-spacing: -0.04em;\n    line-height: 0.95;\n    margin: 0 0 14px;\n    text-wrap: balance;\n  }\n  .title-h1 em {\n    font-style: normal;\n    background: linear-gradient(95deg, var(--drivee-bright), var(--drivee-yellow) 50%, var(--drivee-orange));\n    -webkit-background-clip: text; background-clip: text;\n    color: transparent;\n  }\n  .title-sub {\n    font-size: 14px; line-height:1.5; color: var(--ink-dim);\n    max-width: 320px;\n  }\n\n  /* LEGEND / METRIC SWITCHER */\n  .legend {\n    position:fixed;\n    top: 80px; right: 24px; z-index: 10;\n    width: 260px;\n    background: rgba(13,18,32,0.72);\n    backdrop-filter: blur(18px);\n    -webkit-backdrop-filter: blur(18px);\n    border: 1px solid var(--hair);\n    border-radius: 14px;\n    padding: 16px;\n    pointer-events: auto;\n  }\n  .legend-title {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size:10px; letter-spacing:0.15em;\n    color: var(--ink-dim); text-transform:uppercase;\n    margin-bottom:10px;\n  }\n  .metric-tabs {\n    display:grid; grid-template-columns: repeat(2, 1fr);\n    gap:4px; padding:3px;\n    background: rgba(0,0,0,0.4);\n    border-radius:8px;\n    margin-bottom:14px;\n  }\n  .metric-tab {\n    font: inherit;\n    padding:8px 6px;\n    border:0; background:transparent; color: var(--ink-dim);\n    border-radius:6px; font-size:11px; font-weight:600;\n    letter-spacing:0.02em; cursor:pointer;\n    transition: all 0.18s;\n  }\n  .metric-tab.active {\n    background: var(--ink); color: var(--bg-0);\n  }\n  .metric-tab:not(.active):hover { color: var(--ink); }\n\n  .gradient-bar {\n    height:8px; border-radius:4px; margin: 12px 0 6px;\n    background: linear-gradient(90deg,\n      var(--heat-0) 0%, var(--heat-1) 25%, var(--heat-2) 50%, var(--heat-3) 75%, var(--heat-4) 100%);\n  }\n  .gradient-labels {\n    display:flex; justify-content:space-between;\n    font-family:\"JetBrains Mono\", monospace;\n    font-size:10px; color: var(--ink-dim);\n  }\n\n  .stat-row {\n    display:flex; justify-content:space-between; align-items:baseline;\n    padding: 8px 0;\n    border-top: 1px solid var(--hair);\n    margin-top: 12px;\n  }\n  .stat-row:first-of-type { border-top:0; margin-top:6px; }\n  .stat-key { font-size:11px; color: var(--ink-dim); letter-spacing:0.02em; }\n  .stat-val {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size:14px; font-weight:600; color: var(--ink);\n  }\n  .stat-val small { color: var(--ink-dim); font-weight:400; margin-left:4px; }\n\n  /* HOVER TOOLTIP */\n  .tip {\n    position:fixed; z-index:20;\n    pointer-events:none;\n    background: rgba(13,18,32,0.92);\n    backdrop-filter: blur(12px);\n    border:1px solid var(--hair);\n    border-radius: 10px;\n    padding: 10px 12px;\n    min-width: 180px;\n    transform: translate(-50%, calc(-100% - 14px));\n    transition: opacity 0.12s;\n    opacity: 0;\n  }\n  .tip.show { opacity: 1; }\n  .tip::after {\n    content:\"\"; position:absolute;\n    bottom:-5px; left:50%; transform: translateX(-50%) rotate(45deg);\n    width:10px; heig     opacity: 1; pointer-events: auto;\n    transform: translateX(0) scale(1);\n  }\n  .focus-eyebrow {\n    display:flex; align-items:center; gap:8px;\n    font-family:\"JetBrains Mono\", monospace;\n    font-size:10px; color: var(--drivee-yellow);\n    letter-spacing:0.18em;\n  }\n  .focus-dot {\n    width:7px; height:7px; border-radius:50%;\n    background: var(--drivee-yellow);\n    box-shadow: 0 0 12px var(--drivee-yellow);\n    animation: pulse 1.6s infinite;\n  }\n  .focus-name {\n    font-size: 26px; font-weight: 800; letter-spacing: -0.02em;\n    margin-top: 12px; line-height:1.1;\n  }\n  .focus-zone {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size: 11px; color: var(--ink-dim);\n    letter-spacing: 0.08em;\n    margin-top: 4px;\n  }\n  .focus-bubble {\n    position:relative;\n    margin: 18px 0 16px;\n    padding: 14px 16px;\n    background: var(--ink);\n    color: var(--bg-0);\n    border-radius: 12px;\n  }\n  .focus-bubble-tail {\n    position:absolute; left: -8px; top: 18px;\n    width: 16px; height: 16px;\n    background: var(--ink);\n    transform: rotate(45deg);\n    border-radius: 2px;\n  }\n  .focus-quote {\n    position:relative;\n    font-size: 15px; line-height: 1.35;\n    font-weight: 600; letter-spacing: -0.01em;\n    font-style: italic;\n  }\n  .focus-stats {\n    display:grid; grid-template-columns: repeat(3, 1fr);\n    gap: 4px;\n    padding: 12px 0;\n    border-top: 1px solid var(--hair);\n    border-bottom: 1px solid var(--hair);\n    margin-bottom: 14px;\n  }\n  .focus-stat-key {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size: 9px; color: var(--ink-dim);\n    letter-spacing: 0.12em; text-transform: uppercase;\n    margin-bottom: 4px;\n  }\n  .focus-stat-val {\n    font-family:\"JetBrains Mono\", monospace;\n    font-size: 16px; font-weight: 700;\n  }\n  .focus-actions {\n    display: grid; grid-template-columns: 1fr; gap: 8px;\n  }\n  .focus-btn {\n    border:0; font:inherit; font-weight: 600; font-size: 13px;\n    padding: 11px 14px; border-radius: 10px;\n    cursor: pointer; letter-spacing: 0.01em;\n    background: rgba(255,255,255,0.06);\n    color: var(--ink);\n    transition: all 0.18s;\n  }\n  .focus-btn:hover { background: rgba(255,255,255,0.12); }\n  .focus-btn-primary {\n    background: var(--drivee-orange); color: var(--bg-0);\n  }\n  .focus-btn-primary:hover { background: var(--drivee-yellow); }\n\n  /* officer hover cursor */\n  #scene canvas.officer-hover { cursor: pointer; }\n\n  /* MAP-ONLY MODE: hide all chrome, keep the 3D scene + officer focus card + tooltip */\n  .topbar, .title-card, .legend, .bottom, .height-slider, .compass, #loading { display: none !important; }\n\n  @media (max-width: 760px) {\n    .title-h1 { font-size: 36px; }\n    .title-card { max-width: 240px; }\n    .legend { width: 200px; top: 70px; right: 12px; padding: 12px; }\n    .height-slider { width: calc(100% - 100px); }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div id=\"scene\"><\u002Fdiv>\n\n<div id=\"loading\">\n  <div class=\"loader\">\n    <div class=\"loader-text\">DEPLOYING ENFORCEMENT · 158 ZONES<\u002Fdiv>\n    <div class=\"loader-bar\"><span id=\"lbar\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"topbar\">\n  <div class=\"brand\">\n    <div class=\"brand-mark\"><\u002Fdiv>\n    <div>\n      <div class=\"brand-name\">drivee<span>.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"crumbs\">PARKING ENFORCEMENT · DOWNTOWN CORE · LIVE<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"title-card\">\n  <div class=\"title-eyebrow\"><span class=\"dot\"><\u002Fspan>LIVE · OFFICERS ON DUTY<\u002Fdiv>\n  <h1 class=\"title-h1\">Where the <em>tickets<\u002Fem> happen.<\u002Fh1>\n  <p class=\"title-sub\">Downtown Toronto, live. Heat tiles show ticket density; the figures are officers on patrol; red zones are active enforcement.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"legend\">\n  <div class=\"legend-title\">Height encodes<\u002Fdiv>\n  <div class=\"metric-tabs\">\n    <button class=\"metric-tab active\" data-metric=\"officers\">Officers<\u002Fbutton>\n    <button class=\"metric-tab\" data-metric=\"tickets\">Tickets/hr<\u002Fbutton>\n    <button class=\"metric-tab\" data-metric=\"revenue\">Revenue<\u002Fbutton>\n    <button class=\"metric-tab\" data-metric=\"risk\">Risk<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div id=\"clock\" style=\"margin: 14px 0 4px; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:rgba(0,0,0,0.32); border-radius:10px;\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim); letter-spacing:0.12em;\">TORONTO LIVE<\u002Fdiv>\n      <div id=\"clock-time\" style=\"font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; letter-spacing:0.04em; margin-top:2px;\">--:--<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim); letter-spacing:0.12em;\">PAID HOURS<\u002Fdiv>\n      <div id=\"clock-status\" style=\"font-size:12px; font-weight:700; margin-top:2px; color:var(--drivee-yellow);\">ACTIVE<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"gradient-bar\"><\u002Fdiv>\n  <div class=\"gradient-labels\">\n    <span id=\"gmin\">low<\u002Fspan>\n    <span id=\"gmax\">high<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"stat-row\">\n    <span class=\"stat-key\">Hot zone<\u002Fspan>\n    <span class=\"stat-val\" id=\"stat-top\">—<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"stat-row\">\n    <span class=\"stat-key\">Officers active<\u002Fspan>\n    <span class=\"stat-val\" id=\"stat-mean\">47<small id=\"stat-mean-u\"><\u002Fsmall><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"stat-row\">\n    <span class=\"stat-key\">Tickets / hr<\u002Fspan>\n    <span class=\"stat-val\">312<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"tip\" class=\"tip\">\n  <div class=\"tip-name\">—<\u002F =\"focus-name\">—<\u002Fdiv>\n  <div class=\"focus-zone\" id=\"focus-zone\">—<\u002Fdiv>\n  <div class=\"focus-bubble\">\n    <div class=\"focus-bubble-tail\"><\u002Fdiv>\n    <div class=\"focus-quote\" id=\"focus-quote\">\"Send me back, I need to write more tickets!\"<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"focus-stats\">\n    <div class=\"focus-stat\">\n      <div class=\"focus-stat-key\">Tickets today<\u002Fdiv>\n      <div class=\"focus-stat-val\" id=\"focus-tickets\">—<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"focus-stat\">\n      <div class=\"focus-stat-key\">Avg fine<\u002Fdiv>\n      <div class=\"focus-stat-val\" id=\"focus-fine\">—<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"focus-stat\">\n      <div class=\"focus-stat-key\">Risk<\u002Fdiv>\n      <div class=\"focus-stat-val\" id=\"focus-risk\">—<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"focus-actions\">\n    <button class=\"focus-btn focus-btn-primary\" id=\"focus-redeploy\">⤴ Send to hot zone<\u002Fbutton>\n    <button class=\"focus-btn\" id=\"focus-back\">← Back to map<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"compass\" id=\"compass\" title=\"Reset view\">\n  <div class=\"compass-needle\" id=\"needle\"><\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"6aaa3b37-e63c-4463-b296-474625c0f55a\"><\u002Fscript>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.160.0/build/three.module.js\",\n    \"three/addons/\": \"https://unpkg.com/three@0.160.0/examples/jsm/\"\n  }\n}\n<\u002Fscript>\n<script type=\"module\" src=\"ab7b7163-f137-4b4c-a07f-e3cf49a46dc5\"><\u002Fscript>\n<script>\n(function tickClock(){\n  const t = document.getElementById('clock-time');\n  const s = document.getElementById('clock-status');\n  function tz() {\n    // Render in Toronto time regardless of viewer's timezone\n    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Toronto', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });\n    const parts = fmt.formatToParts(new Date());\n    const o = {};\n    for (const p of parts) o[p.type] = p.value;\n    return { h: +o.hour, m: +o.minute, s: +o.second, str: `${o.hour}:${o.minute}:${o.second}` };\n  }\n  function render(){\n    const c = tz();\n    t.textContent = c.str;\n    const hf = c.h + c.m/60;\n    if (hf < 8 || hf > 21) { s.textContent = 'OVERNIGHT'; s.style.color = 'var(--heat-0)'; }\n    else if ((hf >= 8 && hf < 10) || (hf >= 16 && hf < 19)) { s.textContent = 'PEAK'; s.style.color = 'var(--drivee-orange)'; }\n    else { s.textContent = 'ACTIVE'; s.style.color = 'var(--drivee-yellow)'; }\n  }\n  render();\n  setInterval(render, 1000);\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
