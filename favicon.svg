<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Drivee">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#6E9BFF"/>
      <stop offset="55%" stop-color="#2D63F0"/>
      <stop offset="100%" stop-color="#E89B22"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#08060F"/>

  <!-- orbiting disc, echoing the particle ring on the site -->
  <ellipse cx="32" cy="34" rx="25" ry="9.5"
           fill="none" stroke="url(#ring)" stroke-width="2.6"
           transform="rotate(-18 32 34)" opacity=".95"/>

  <!-- the planet -->
  <circle cx="32" cy="30" r="10.5" fill="#2D63F0"/>
  <circle cx="28.4" cy="26.6" r="3.6" fill="#8FB2FF" opacity=".55"/>
</svg>
